name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
          POSTGRES_DB: nimbus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NIMBUS_TEST_DATABASE_URL: postgres://nimbus:nimbus@127.0.0.1:5432/nimbus?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: make test
      - run: go vet ./...
      - run: npm run protocol:check
      - run: make pack-runtime
      - name: Verify generated outputs are not tracked
        run: |
          test -z "$(git ls-files internal/runtimeprotocol/generated runtime/src/generated runtime/dist runtime/test-dist release)"

  deploy-render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: render-dev-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Render image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nimbus-cloud-agent/nimbus-cloud-agent:dev
            ghcr.io/nimbus-cloud-agent/nimbus-cloud-agent:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nimbus-cloud-agent/nimbus-cloud-agent
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/nimbus-cloud-agent/nimbus-cloud-agent:${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Set the RENDER_DEPLOY_HOOK_URL repository secret to enable automatic Render deploys."
            exit 0
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          hook = urlsplit(os.environ["RENDER_DEPLOY_HOOK_URL"])
          query = parse_qsl(hook.query, keep_blank_values=True)
          query.append(("imgURL", os.environ["IMAGE_URL"]))
          url = urlunsplit((hook.scheme, hook.netloc, hook.path, urlencode(query), hook.fragment))
          request = Request(url, method="POST")
          try:
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"Render deploy hook returned HTTP {response.status}")
                  print("Render deploy triggered")
          except HTTPError as error:
              raise SystemExit(f"Render deploy hook returned HTTP {error.code}") from None
          except URLError:
              raise SystemExit("Render deploy hook request failed") from None
          PY
