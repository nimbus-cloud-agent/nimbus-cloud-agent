name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: make test
      - run: make pack-runtime
      - name: Build macOS and Linux executables
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            os="${target%-*}"
            arch="${target#*-}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "release/nimbus-$target" ./cmd/nimbus
          done
          cd release
          sha256sum nimbus-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
